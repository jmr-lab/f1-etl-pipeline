name: F1 ETL Pipeline

on:
  workflow_dispatch:
  
  push:
    paths:
      - 'data/*.csv'
      - 'src/**/*.py'

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: pip install pandas
      
      - name: Extract data
        run: python src/extract.py
        
      - name: Upload extracted data
        uses: actions/upload-artifact@v4
        with:
          name: extracted-data
          path: output/extracted_data.pkl
          if-no-files-found: error
          retention-days: 1

  transform:
    runs-on: ubuntu-latest
    needs: extract
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: pip install pandas
      
      - name: Download extracted data
        uses: actions/download-artifact@v4
        with:
          name: extracted-data
          path: output
      
      - name: Transform data
        run: python src/transform.py
      
      - name: Upload transformed data
        uses: actions/upload-artifact@v4
        with:
          name: transformed-data
          path: output/transformed_data.pkl
          if-no-files-found: error
          retention-days: 1

  validate:
    runs-on: ubuntu-latest
    needs: transform
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: pip install pandas
      
      - name: Download transformed data
        uses: actions/download-artifact@v4
        with:
          name: transformed-data
          path: output
      
      - name: Validate data
        run: python src/validate.py
      
      - name: Pass through validated data
        uses: actions/upload-artifact@v4
        with:
          name: validated-data
          path: output/transformed_data.pkl
          retention-days: 1

  load:
    runs-on: ubuntu-latest
    needs: validate
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: pip install pandas
      
      - name: Download validated data
        uses: actions/download-artifact@v4
        with:
          name: validated-data
          path: output
      
      - name: Load data
        run: python src/load.py
      
      - name: Check outputs exist
        run: |
          [ -f output/formula1.csv ] && \
          echo "::notice::Pipeline completed! $(stat -c%s output/formula1.csv) bytes" || \
          { echo "::error::No output file found!"; exit 1; }
      
      - name: Commit outputs
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'Update formula1 outputs via ETL pipeline'
          file_pattern: output/formula1.csv output/formula1.sql
          branch: ${{ github.ref_name }}
