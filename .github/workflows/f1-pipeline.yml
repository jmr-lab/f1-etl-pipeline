name: F1 ETL Pipeline

on:
  workflow_dispatch:
  
  push:
    paths:
      - 'data/*.csv'
      - 'src/**/*.py'
      - 'run_pipeline.py'

permissions:
  contents: write

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: pip install pandas
      
      - name: Create output directory
        run: mkdir -p output
      
      # Stage 1: Extract
      - name: Extract data
        id: extract
        run: python run_pipeline.py --stage extract
        
      - name: Cache extracted data
        uses: actions/cache@v4
        with:
          path: output/extracted_data.pkl
          key: extracted-data-${{ github.sha }}
      
      # Stage 2: Transform
      - name: Transform data
        id: transform
        run: python run_pipeline.py --stage transform
      
      - name: Cache transformed data
        uses: actions/cache@v4
        with:
          path: output/transformed_data.pkl
          key: transformed-data-${{ github.sha }}
      
      # Stage 3: Validate
      - name: Validate data
        id: validate
        run: python run_pipeline.py --stage validate
      
      - name: Cache validated data
        uses: actions/cache@v4
        with:
          path: output/validated_data.pkl
          key: validated-data-${{ github.sha }}
      
      # Stage 4: Load
      - name: Load data
        id: load
        run: python run_pipeline.py --stage load
      
      # Check outputs and commit
      - name: Check outputs exist
        id: check-output
        run: |
          if [ -f output/formula1.csv ]; then
            echo "has_output=true" >> $GITHUB_OUTPUT
            FILE_SIZE=$(stat -c%s output/formula1.csv)
            echo "file_size=$FILE_SIZE" >> $GITHUB_OUTPUT
            echo "::notice::Pipeline completed! Output: $FILE_SIZE bytes"
          else
            echo "::error::No output file found!"
            exit 1
          fi
      
      - name: Commit outputs
        if: steps.check-output.outputs.has_output == 'true'
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'Update formula1 outputs via ETL pipeline'
          file_pattern: output/formula1.csv output/formula1.sql
          branch: ${{ github.ref_name }}
          skip_dirty_check: false
          add_options: '-A'
