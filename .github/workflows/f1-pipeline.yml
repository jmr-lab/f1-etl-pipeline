name: F1 ETL Pipeline

on:
  workflow_dispatch:
  
  push:
    paths:
      - 'data/*.csv'
      - 'src/**/*.py'
      - 'run_pipeline.py'

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    outputs:
      extracted: ${{ steps.extract-success.outputs.result }}
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: pip install pandas
      
      - name: Create output directory
        run: mkdir -p output
      
      - name: Extract data
        id: extract-step
        run: python run_pipeline.py --stage extract
        
      - name: Mark success
        id: extract-success
        if: success()
        run: echo "result=true" >> $GITHUB_OUTPUT
      
      - name: Upload extracted data
        uses: actions/upload-artifact@v4
        with:
          name: extracted-data
          path: output/extracted_data.pkl
          retention-days: 1

  transform:
    runs-on: ubuntu-latest
    needs: extract
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: pip install pandas
      
      - name: Download extracted data
        uses: actions/download-artifact@v4
        with:
          name: extracted-data
          path: output
      
      - name: Transform data
        run: python run_pipeline.py --stage transform
      
      - name: Upload transformed data
        uses: actions/upload-artifact@v4
        with:
          name: transformed-data
          path: output/transformed_data.pkl
          retention-days: 1

  validate:
    runs-on: ubuntu-latest
    needs: transform
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: pip install pandas
      
      - name: Download transformed data
        uses: actions/download-artifact@v4
        with:
          name: transformed-data
          path: output
      
      - name: Validate data
        run: python run_pipeline.py --stage validate
      
      - name: Upload validated data
        uses: actions/upload-artifact@v4
        with:
          name: validated-data
          path: output/validated_data.pkl
          retention-days: 1

  load:
    runs-on: ubuntu-latest
    needs: validate
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: pip install pandas
      
      - name: Download validated data
        uses: actions/download-artifact@v4
        with:
          name: validated-data
          path: output
      
      - name: Save outputs
        run: python run_pipeline.py --stage load
      
      - name: Check outputs exist
        id: check-output
        run: |
          if [ -f output/formula1.csv ]; then
            echo "has_output=true" >> $GITHUB_OUTPUT
            FILE_SIZE=$(stat -c%s output/formula1.csv)
            echo "file_size=$FILE_SIZE" >> $GITHUB_OUTPUT
            echo "::notice::Pipeline completed! Output: $FILE_SIZE bytes"
          else
            echo "::error::No output file found!"
            exit 1
          fi
      
      - name: Commit outputs
        if: steps.check-output.outputs.has_output == 'true'
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'Update formula1 outputs via ETL pipeline'
          file_pattern: output/formula1.csv output/formula1.sql
          branch: ${{ github.ref_name }}
          skip_dirty_check: false
          add_options: '-A'
