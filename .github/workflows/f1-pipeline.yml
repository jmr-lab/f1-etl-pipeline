name: F1 ETL Pipeline

on:
  workflow_dispatch:
  
  push:
    paths:
      - 'data/raw/*.csv'
      - 'src/**/*.py'

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    
    steps:
      - name: Install dependencies
        run: pip install pandas requests lxml beautifulsoup4

      - name: Scrape Wikipedia for fresh data
        run: python src/scrape.py
        continue-on-error: true
      
      - name: Upload scraped data
        uses: actions/upload-artifact@v4
        with:
          name: scraped-data
          path: data/raw/*.csv
          if-no-files-found: warn
      
      - name: Verify cached data exists
        run: |
          if [ ! -d "data/raw" ] || [ -z "$(ls -A data/raw)" ]; then
            echo "No fresh scrape found. Check if existing data/raw files exist."
          fi
          
  extract:
    runs-on: ubuntu-latest
    needs: scrape
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: pip install pandas requests lxml beautifulsoup4
      
      - name: Extract data
        run: python src/extract.py
        
      - name: Upload extracted data
        uses: actions/upload-artifact@v4
        with:
          name: extracted-data
          path: output/extracted_data.pkl
          if-no-files-found: error
          retention-days: 1

  transform:
    runs-on: ubuntu-latest
    needs: extract
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: pip install pandas
      
      - name: Download extracted data
        uses: actions/download-artifact@v4
        with:
          name: extracted-data
          path: output
      
      - name: Transform data
        run: python src/transform.py
      
      - name: Upload transformed data
        uses: actions/upload-artifact@v4
        with:
          name: transformed-data
          path: output/transformed_data.pkl
          if-no-files-found: error
          retention-days: 1

  validate:
    runs-on: ubuntu-latest
    needs: transform
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: pip install pandas
      
      - name: Download transformed data
        uses: actions/download-artifact@v4
        with:
          name: transformed-data
          path: output
      
      - name: Validate data
        run: python src/validate.py
      
      - name: Pass through validated data
        uses: actions/upload-artifact@v4
        with:
          name: validated-data
          path: output/transformed_data.pkl
          retention-days: 1

  load:
    runs-on: ubuntu-latest
    needs: validate
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: pip install pandas
      
      - name: Download validated data
        uses: actions/download-artifact@v4
        with:
          name: validated-data
          path: output
      
      - name: Load data
        run: python src/load.py
      
      - name: Verify and manually stage output files
        run: |
          echo "=== Verifying files exist ==="
          ls -la output/
          
          echo ""
          echo "=== Manually adding output files ==="
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add data/processed/formula1.csv sql/formula1.sql sql/formula1.db
          
          echo ""
          echo "=== Git status ==="
          git status --porcelain
          
          echo ""
          echo "=== Check for uncommitted files ==="
          if git diff --quiet --cached; then
            echo "WARNING: No staged files found!"
            exit 1
          else
            echo "SUCCESS: Files staged and ready to commit"
          fi
      
      - name: Commit outputs
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'Update formula1 outputs via ETL pipeline (${{ github.sha }})'
          file_pattern: 'data/processed/formula1.csv sql/formula1.sql sql/formula1.db'
          branch: ${{ github.ref_name }}
