name: F1 ETL Pipeline

on:
  workflow_dispatch:
  
  push:
    paths:
      - 'data/*.csv'
      - 'src/**/*.py'
      - 'run_pipeline.py'

# Add permissions for the workflow to commit changes
permissions:
  contents: write

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: pip install pandas
      
      - name: Create output directory if needed
        run: mkdir -p output
      
      - name: Run ETL pipeline
        id: pipeline
        run: python run_pipeline.py
        
      - name: Check output exists
        id: check-output
        run: |
          if [ -f output/formula1.csv ]; then
            echo "has_output=true" >> $GITHUB_OUTPUT
            FILE_SIZE=$(stat -c%s output/formula1.csv 2>/dev/null || stat -f%z output/formula1.csv)
            echo "file_size=$FILE_SIZE" >> $GITHUB_OUTPUT
            echo "::notice::Pipeline completed successfully! Output: $FILE_SIZE bytes"
          else
            echo "has_output=false" >> $GITHUB_OUTPUT
            echo "::error::Pipeline completed but no output file found!"
            exit 1
          fi
      
      - name: Commit outputs to repo
        if: steps.check-output.outputs.has_output == 'true'
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'Update formula1.csv via ETL pipeline'
          file_pattern: output/formula1.csv output/formula1.sql
          branch: ${{ github.ref_name }}
          skip_dirty_check: false
          add_options: '-A'
