name: Test database connection

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-database:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install MySQL connector
        run: pip install mysql-connector-python

      - name: Connect and list tables
        env:
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        run: |
          python <<'PY'
          import os
          import mysql.connector

          connection = mysql.connector.connect(
              host=os.environ["DB_HOST"],
              port=int(os.environ["DB_PORT"]),
              user=os.environ["DB_USER"],
              password=os.environ["DB_PASSWORD"],
              connection_timeout=10,
          )

          cursor = connection.cursor()
          cursor.execute("""
              SELECT TABLE_SCHEMA, TABLE_NAME
              FROM information_schema.TABLES
              WHERE TABLE_SCHEMA NOT IN (
                  'information_schema',
                  'performance_schema',
                  'mysql',
                  'sys'
              )
              ORDER BY TABLE_SCHEMA, TABLE_NAME
          """)

          tables = cursor.fetchall()

          print("Database connection succeeded.")
          print(f"Found {len(tables)} tables.")

          summary = "## Database connection test\n\n"
          summary += "Connection succeeded.\n\n"
          summary += f"Found **{len(tables)} tables**.\n\n"
          summary += "| Database | Table |\n"
          summary += "|---|---|\n"

          for database, table in tables:
              print(f"{database}.{table}")
              summary += f"| `{database}` | `{table}` |\n"

          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as file:
              file.write(summary)

          cursor.close()
          connection.close()
          PY
